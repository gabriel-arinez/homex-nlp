[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "homex-nlp"
version = "0.1.0"
description = "Componente ASR/NLP de HOMEX; refactorización incremental"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # spaCy 3.8 invokes click from its CLI import path although current metadata
    # reaches it only through optional demo tooling; declare the runtime need.
    "click>=8.1,<9",
    "pydantic==2.13.4",
    "spacy==3.8.13",
]

[project.scripts]
homex-nlp = "homex_nlp.cli:main"
homex-asr = "homex_nlp.asr_cli:main"

[project.optional-dependencies]
asr = ["faster-whisper==1.2.1"]
demo = ["fastapi==0.136.3", "uvicorn==0.48.0", "python-multipart==0.0.30"]
dev = ["jsonschema>=4.23,<5", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/homex_nlp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/tools/export_schemas.py",
    "/schemas",
    "/examples",
    "/docs/contract-v1.md",
    "/docs/configuration.md",
    "/docs/integration-django.md",
    "/docs/F06_DISTRIBUCION_Y_CIERRE.md",
    "/docs/release-v0.1.0.md",
    "/pyproject.toml",
    "/README.md",
    "/uv.lock",
    "/.python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
