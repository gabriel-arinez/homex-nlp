name: Paquete NLP

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      corpus_only: ${{ steps.paths.outputs.corpus_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        run: python3 tools/ci_corpus_scope.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"

  package:
    needs: scope
    if: needs.scope.outputs.corpus_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # F10 verifica el archivo fuente del commit histórico F06

      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: bc375894036d30cefbc8cdf7c512315aaf1ab971
          path: backend-f10

      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: 8f6fed352e8e49f819884e9db7ffb1d24f355ca7
          path: backend-prf04

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"

      - name: Instalar entorno fijado
        run: uv sync --locked --extra dev --extra asr --python 3.11.15

      - name: Calidad, esquemas, corpus y contratos
        run: make check

      - name: Verificar backend PRF-04 v6 congelado (sin confundirlo con v7)
        run: |
          python3 tools/verificar_backend_prf04.py backend-prf04 \
            --revision 8f6fed352e8e49f819884e9db7ffb1d24f355ca7

      - name: Verificar distribución consumible
        run: make distribution-check

      - name: Verificar runtime y contrato F10
        env:
          BACKEND_F10_PATH: backend-f10
        run: make f10-check

      - name: Publicar perfil agregado F10
        uses: actions/upload-artifact@v4
        with:
          name: homex-nlp-f10-profile-${{ github.sha }}
          path: /tmp/homex-nlp-f10-profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artefactos de integración
        uses: actions/upload-artifact@v4
        with:
          name: homex-nlp-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Audit frozen dependency lock (all extras and groups)
        run: uv audit --locked

  prf04-experiment:
    needs: scope
    if: needs.scope.outputs.corpus_only != 'true'
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - run: uv sync --locked --extra dev
      - name: Train experimental NER using sealed train/dev only
        run: >-
          uv run python -m training.train_prf04 --epochs 10
          --destination "$RUNNER_TEMP/prf04-ner"
      - name: Validate structured A/B/C outputs on dev without promotion
        run: >-
          uv run python -m training.evaluate_structured_prf04
          "$RUNNER_TEMP/prf04-ner/model-dev-best"
          "$RUNNER_TEMP/prf04-structured-dev.json"
      - uses: actions/upload-artifact@v4
        with:
          name: prf04-experiment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/prf04-ner/entrenamiento.json
            ${{ runner.temp }}/prf04-structured-dev.json
          if-no-files-found: error
          retention-days: 30
