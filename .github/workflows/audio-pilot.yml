name: Audio pilot — synthetic only, no ASR or training
on:
  push:
    paths:
      - 'training/audio_pilot/**'
      - 'tests/training/test_audio_pilot.py'
      - 'tests/training/test_human_gold.py'
      - 'tools/ci_corpus_scope.py'
      - '.github/workflows/audio-pilot.yml'
  pull_request:
    paths:
      - 'training/audio_pilot/**'
      - 'tests/training/test_audio_pilot.py'
      - 'tests/training/test_human_gold.py'
      - 'tools/ci_corpus_scope.py'
      - '.github/workflows/audio-pilot.yml'
permissions:
  contents: read
jobs:
  audio-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
      - run: uv sync --locked --extra dev --python 3.11.15
      - name: Full synthetic regression under training and ASR prohibition
        run: uv run --locked --extra dev python -m training.audio_pilot.gate --evidence "$RUNNER_TEMP/audio-tools"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: audio-tools-${{ github.sha }}
          path: ${{ runner.temp }}/audio-tools/result.json
          retention-days: 14
